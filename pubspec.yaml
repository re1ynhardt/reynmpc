name: spotify_flutter
description: Десктопный аудиоплеер в стиле Spotify с подключаемым бэкендом
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Реальное воспроизведение аудио (потоки/файлы по URL)
  just_audio: ^0.9.40

  # just_audio сам по себе НЕ умеет играть звук на Windows/Linux — только
  # Android/iOS/macOS/Web. Этот пакет добавляет реализацию через media_kit
  # (libmpv), она надёжнее штатного just_audio_windows именно для потокового
  # воспроизведения по HTTPS (как раз наш случай — треки играются прямой
  # ссылкой из Yandex Object Storage).
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any

  # Простой и предсказуемый state management
  provider: ^6.1.2

  # S3-совместимый клиент — им же читаем Yandex Object Storage
  minio: ^3.5.0

  # Локальное хранилище аккаунтов и текущей сессии (вход/регистрация)
  shared_preferences: ^2.2.3

  # Хеширование паролей перед сохранением на диск

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
